<title>Jumpmap — 낙서 우주기지</title>
<meta name="theme-color" content="#0b1736">
<style>
:root{color-scheme:dark;--night:#0b1736;--ink:#fff1cf;--gold:#ffd267;--mint:#72e8f3;--muted:#a9b6cd;font-family:ui-rounded,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--mint);outline-offset:4px}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:clamp(8px,1.5vw,20px);gap:12px;max-width:1800px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand-icon{border:2px solid var(--ink);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;transform:rotate(-12deg);font-size:24px}
h1{margin:0;font-size:clamp(20px,3vw,30px);font-weight:900;letter-spacing:.08em}.brand p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:16px;font-size:14px;font-variant-numeric:tabular-nums;align-items:center;flex-wrap:wrap}.stats b{color:var(--ink);font-weight:700}.stats span{color:var(--muted)}
.coin-chip{padding:8px 12px;border:1px solid #6e644f;border-radius:10px;background:#20283b}.coin-chip b{color:var(--gold)}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.controls button{font-size:14px;min-height:44px;padding:8px 12px;border:1px solid #3c506e;border-radius:10px;background:#14233e}
.controls button:hover{border-color:var(--gold);background:#20314b}
.stage{position:relative;flex:1;min-height:0;border:1px solid #3e5273;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#142747}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;pointer-events:none;background:linear-gradient(180deg,rgba(8,18,40,.75),rgba(8,18,40,.38) 72%,rgba(8,18,40,.2));overflow:auto}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--gold);margin:0}
.overlay h2{font-size:clamp(28px,5vw,60px);line-height:1.12;letter-spacing:-.04em;margin:0;text-shadow:0 4px 24px #0b1736}
.overlay p{font-size:16px;line-height:1.6;max-width:660px;margin:0;color:#d0d9e7}
.levels{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto;margin-top:8px}
.levels button{border:1px solid #64718b;border-radius:14px;min-height:80px;min-width:160px;padding:14px 18px;background:#11213bed;display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;font-size:16px;font-weight:700}
.levels button small{font-size:13px;color:var(--muted);font-weight:400}
.levels button[aria-pressed="true"]{border:2px solid var(--gold);background:#29324b;box-shadow:0 0 24px #ffd26718}
.tap{padding:12px 24px;background:var(--gold);color:#13254b;border-radius:50px;font-size:14px;font-weight:850;letter-spacing:.06em}
footer{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:1.5;color:var(--muted)}footer strong{color:var(--gold);font-weight:500}
kbd{font:inherit;border:1px solid #55647e;border-radius:4px;padding:0 4px}
@media(max-width:700px){.app{gap:8px;padding:8px}.brand-icon{display:none}header{gap:6px}.brand p{display:none}.stats{gap:9px}.controls{width:100%;justify-content:space-between}.controls button{flex:1;padding:6px;font-size:13px}.coin-chip{padding:6px}.overlay{padding:14px;gap:10px}.levels{gap:6px}.levels button{min-width:0;padding:9px;font-size:14px;min-height:64px}.levels button small{font-size:12px}.overlay p{font-size:14px}.eyebrow{font-size:11px}footer{font-size:12px}footer .extra{display:none}}
@media(max-height:520px){.app{gap:4px;padding:6px}header{flex-wrap:nowrap}.brand-icon,.brand p{display:none}h1{font-size:18px}.controls{width:auto}.controls button{min-height:36px;font-size:12px}.stats{font-size:12px;gap:7px}.coin-chip{padding:4px}.overlay{gap:5px;padding:10px}.overlay h2{font-size:28px}.overlay p{font-size:13px}.levels{margin:0}.levels button{padding:6px 12px;min-height:50px;font-size:14px}.tap{padding:6px 18px}.eyebrow,footer{display:none}}
</style>
<div class="app">
  <header>
    <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><div><h1>JUMPMAP</h1><p id="levelName">낙서 우주기지</p></div></div>
    <div class="stats">
      <span class="coin-chip" id="coinsStat">태극 코인 <b id="coins">0 / 24</b></span>
      <span>시도 <b id="att">1</b></span><span>진행 <b id="pct">0%</b></span><span>최고 <b id="best">0%</b></span>
    </div>
    <div class="controls">
      <button id="retry" type="button" title="R 키로도 다시 시작">다시 시작</button>
      <button id="pause" type="button" title="Esc 키로도 일시정지">일시정지</button>
      <button id="menu" type="button">레벨 선택</button>
      <button id="mute" type="button">사운드 켜짐</button>
    </div>
  </header>
  <main class="stage" id="stage" aria-label="Jumpmap 점프 게임">
    <canvas id="cv" aria-label="탭, 클릭, 스페이스 또는 위쪽 화살표로 점프하는 게임. UFO 아래 붉은 띠는 점프로 피하세요.">이 게임은 Canvas를 지원하는 브라우저가 필요합니다.</canvas>
    <div class="overlay" id="ov">
      <div class="eyebrow">FROM YOUR SKETCH · DOODLE ORBIT</div>
      <h2 id="ovTitle">낙서가 우주가 되는 순간</h2>
      <p id="ovSub">종이 위에서 출발한 작은 탐험. UFO를 넘고 태극 코인 24개를 모아 출구로 달려보세요.</p>
      <div class="levels" id="levels">
        <button type="button" data-lv="2" aria-pressed="true">낙서 우주기지<small>사진에서 태어난 새 맵</small><small id="b2">최고 0%</small></button>
        <button type="button" data-lv="0" aria-pressed="false">네온 시티<small id="b0">최고 0%</small></button>
        <button type="button" data-lv="1" aria-pressed="false">레이저 괴물<small id="b1">최고 0%</small></button>
      </div>
      <div class="tap" id="ovTap">TAP TO EXPLORE</div>
    </div>
  </main>
  <footer><span>탭 / <kbd>Space</kbd> 점프 · 누르면 연속 점프 · <strong>UFO 아래 붉은 띠를 넘으세요</strong></span><span class="extra">노란 패드는 높이 점프 · <kbd>Esc</kbd> 일시정지 · <kbd>R</kbd> 다시 시작</span></footer>
</div>
<script>
